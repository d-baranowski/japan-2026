<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>Japan 2026</title>
<style>
@font-face { font-family: 'Shippori Mincho'; font-weight: 400; font-display: block; src: url(assets/fonts/shippori-400-japanese.woff2) format('woff2'); }
@font-face { font-family: 'Shippori Mincho'; font-weight: 700; font-display: block; src: url(assets/fonts/shippori-700-japanese.woff2) format('woff2'); }
@font-face { font-family: 'Shippori Mincho'; font-weight: 400; font-display: block; src: url(assets/fonts/shippori-400-latin.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
@font-face { font-family: 'Shippori Mincho'; font-weight: 700; font-display: block; src: url(assets/fonts/shippori-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
@font-face { font-family: 'Caveat'; font-weight: 600; font-display: block; src: url(assets/fonts/caveat-600-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113; }
@font-face { font-family: 'Caveat'; font-weight: 600; font-display: block; src: url(assets/fonts/caveat-600-latin.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
:root {
  --train: #5aa2ff; --foot: #ff5a36; --bike: #2fd3a0; --flight: #f4c44e;
  --paper: #f3eee4; --ink: #25221e;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
}
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(ellipse at 62% 38%, #14213f 0%, #0a1122 50%, #04070e 100%);
  color: #eef0f5; font-family: var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.fallback-message { display: none; }
.impress-not-supported .fallback-message { display: block; padding: 40px; font-size: 24px; }
.impress-not-supported .step { display: none; }

/* ------------------------------------------------------------ map: <canvas> images inside the impress scene, drawn by JS */
canvas.mapcv { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }

/* ------------------------------------------------------------ steps */
.step { opacity: .5; transition: opacity .9s; }
.step.active { opacity: 1; }
.step.chapter, .step.title-step, .step.flight-step, .step.viz { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .9s, visibility 0s .9s; }
.step.chapter.active, .step.title-step.active, .step.flight-step.active, .step.viz.active { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .9s, visibility 0s; }
.step.card.past, .step.card.future { opacity: .55; }
body[class*="impress-on-ch-"] .step.card { opacity: .25; }   /* chapter titles: photos only peek */

/* polaroid */
.polaroid { margin: 0; background: var(--paper); padding: 22px 22px 0; border-radius: 3px; position: relative;
  transform: rotate(var(--tilt, 0deg));
  box-shadow: 0 24px 40px -14px rgba(0, 0, 0, .75); }
.polaroid::before { content: ''; position: absolute; top: -24px; left: 50%; width: 230px; height: 50px;
  transform: translateX(-50%) rotate(-2.5deg); background: var(--tape); opacity: .82; }
.tape-train { --tape: var(--train); } .tape-foot { --tape: var(--foot); } .tape-bike { --tape: var(--bike); } .tape-flight { --tape: var(--flight); }
.photos { display: flex; gap: 20px; }
.ph { overflow: hidden; background: #d9d3c6; position: relative; }
.ph img, .ph video { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph[data-alt]::after { content: attr(data-alt); position: absolute; right: 16px; top: 16px; font: 800 30px var(--sans); color: #fff;
  background: rgba(255, 90, 54, .92); padding: 8px 18px; border-radius: 40px; letter-spacing: .02em; }
.step.card.culled { visibility: hidden; }
.ph .play { position: absolute; left: 18px; top: 16px; font: 700 18px var(--sans); letter-spacing: .12em; color: #fff; background: rgba(0, 0, 0, .45); padding: 6px 12px; border-radius: 30px; }
/* grows when a long caption wraps on a narrow card (a fixed height let the top line slide under the photo) */
figcaption { min-height: 118px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 10px 6px 12px; }
.cap { font: 600 50px/1.02 'Caveat', cursive; color: var(--ink); }
.meta { font: 600 16px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: #8d8577; margin-top: 8px; }

/* chapter titles */
.chapter, .title-step, .flight-step { width: 1920px; height: 1080px; }
.ch-inner { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); max-width: 1250px; padding: 70px 90px 80px 80px;
  background: radial-gradient(closest-side, rgba(6, 10, 21, .92), rgba(6, 10, 21, .75) 65%, rgba(6, 10, 21, 0)); border-radius: 50%; }
.ch-num { font: 700 26px var(--sans); letter-spacing: .4em; color: var(--flight); }
.ch-jp { font: 700 210px/1.05 var(--serif); color: #fff; text-shadow: 0 10px 50px rgba(0, 0, 0, .6); }
.ch-en { font: 700 86px/1.05 var(--serif); color: #f3eee4; }
.ch-dates { font: 700 26px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: #9fb3dc; margin-top: 26px; }
.ch-sub { font: 400 36px/1.35 var(--sans); color: #d9dfea; margin: 16px 0 0; max-width: 1050px; }

/* overview / route / thanks */
.ov-inner { position: absolute; right: 70px; bottom: 60px; text-align: right; max-width: 1150px; padding: 40px 50px;
  background: radial-gradient(closest-side, rgba(6, 10, 21, .85), rgba(6, 10, 21, .55) 70%, rgba(6, 10, 21, 0)); }
.ov-jp { font: 700 230px/1 var(--serif); color: #fff; }
.ov-en { font: 700 120px/1 var(--serif); color: #f3eee4; }
.ov-en span { color: var(--flight); }
.ov-en.small { font-size: 96px; }
.ov-sub { font: 400 36px/1.35 var(--sans); color: #d9dfea; margin-top: 18px; }
.ov-meta { font: 700 24px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #9fb3dc; margin-top: 18px; }
.ov-hint { font: 600 20px var(--sans); color: #7584a8; margin-top: 26px; letter-spacing: .1em; }
.fs-btn { display: inline-flex; align-items: center; gap: 14px; margin-top: 34px; padding: 16px 32px; cursor: pointer;
  font: 700 26px var(--sans); letter-spacing: .08em; color: #fff; background: rgba(255, 255, 255, .08);
  border: 2px solid rgba(255, 255, 255, .4); border-radius: 44px; }
.fs-btn:hover { background: rgba(255, 255, 255, .2); border-color: #fff; }
.ov-stats { display: flex; gap: 46px; justify-content: flex-end; margin-top: 30px; }
.ov-stats b { display: block; white-space: nowrap; font: 700 58px var(--sans); color: #fff; }
.ov-stats span { font: 600 20px var(--sans); color: #9fb3dc; text-transform: uppercase; letter-spacing: .1em; }
.route-legend { display: flex; gap: 30px; justify-content: flex-end; margin-top: 30px; font: 600 22px var(--sans); color: #cfd6e6; }
.route-legend span { display: flex; align-items: center; gap: 12px; }
.route-legend i { display: inline-block; width: 46px; height: 7px; border-radius: 4px; }
.lg-flight { background: var(--flight); } .lg-foot { background: var(--foot); } .lg-bike { background: var(--bike); }
.lg-train { background: repeating-linear-gradient(90deg, var(--train) 0 12px, transparent 12px 20px); }
.route-legend i.lg-dot { width: 14px; height: 14px; border-radius: 50%; background: #fff4d8; }

/* flights */
.fly-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.fly-big { font-size: 170px; color: var(--flight); line-height: 1; transform: rotate(-12deg); }
.fly-t { font: 700 110px var(--serif); color: #fff; margin-top: 10px; }
.fly-s { font: 400 36px var(--sans); color: #d9dfea; margin-top: 10px; }

/* data panels */
.viz { width: 1800px; }
.panel { background: rgba(18, 26, 44, .97); border-radius: 26px; padding: 44px 54px 34px; box-shadow: 0 0 0 1px #243049; }
.panel header { display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 40px; }
.panel h2 { font: 700 64px/1.05 var(--serif); margin: 0; color: #fff; grid-column: 1; }
.panel header p { font: 400 28px/1.3 var(--sans); color: #b4bccd; margin: 10px 0 0; grid-column: 1; }
.panel header p strong { color: #fff; }
.legend { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: flex-end; max-width: 640px; font: 600 22px var(--sans); color: #cfd6e6; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
.legend .tri-k { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 17px solid; display: inline-block; }
svg.chart { width: 100%; height: auto; display: block; margin-top: 24px; overflow: visible; }
svg.chart text { font-family: var(--sans); }
.axl { fill: #8a94ab; font-size: 21px; }
.axl.strong { fill: #dfe5f1; font-weight: 700; }
.grid { stroke: #243049; stroke-width: 1; }
.gx { stroke: #3a4560; }
.ref { stroke: #b4bccd; stroke-width: 1.5; stroke-dasharray: 8 8; opacity: .7; }
.refl { fill: #b4bccd; font-size: 20px; font-weight: 600; }
.refs { fill: #7f89a0; font-weight: 400; }
.anno { fill: #c5ccdb; font-size: 21px; font-weight: 600; }
.anno.strong { fill: #fff; font-size: 27px; font-weight: 800; }
.band { fill: #c5ccdb; font-size: 17px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.dot { stroke: #121a2c; stroke-width: 2.5; }
.dot:hover, .tri-m:hover { stroke: #fff; }
.tri-m { stroke: #121a2c; stroke-width: 2.5; }
.dayl { fill: #dfe5f1; font-size: 22px; font-weight: 700; }
.hutl { fill: #f3eee4; font-size: 19px; font-weight: 700; }
.moon { fill: #4b5878; font-size: 24px; }
.rowl { fill: #eef0f5; font-size: 32px; font-weight: 700; }
.val { fill: #fff; font-size: 34px; font-weight: 800; }
.panel footer { font: 400 19px/1.4 var(--sans); color: #7f89a0; margin-top: 18px; }
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; margin-top: 10px; }
.tile { background: #1a2442; border-radius: 16px; padding: 22px 24px; }
.tile .tl { font: 700 17px var(--sans); color: #9fb3dc; text-transform: uppercase; letter-spacing: .1em; }
.tile .tv { font: 800 46px var(--sans); color: #fff; margin-top: 8px; white-space: nowrap; }
.tiles.four { grid-template-columns: repeat(4, 1fr); margin-top: 26px; }
.bike-strip { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 14px; align-items: flex-end; }
.bike-strip div { display: flex; flex-direction: column; align-items: center; width: 64px; font: 600 16px var(--sans); color: #7f89a0; }
.bike-strip i { display: block; width: 30px; border-radius: 6px 6px 0 0; background: #2a3656; }
.bike-strip span { margin-top: 8px; text-transform: uppercase; letter-spacing: .08em; }
.bike-strip b { font: 800 22px var(--sans); color: #b4bccd; }
.bike-strip .on i { background: var(--bike); }
.bike-strip .on span, .bike-strip .on b { color: #fff; }
.polaroid.mini { flex: none; }
.polaroid.mini .cap { font-size: 38px; }

/* HUD */
#hud { position: fixed; left: 34px; bottom: 30px; z-index: 10; pointer-events: none; transition: opacity .6s; }
#hud .d1 { font: 800 15px var(--sans); letter-spacing: .3em; color: var(--flight); text-transform: uppercase; }
#hud .d2 { font: 700 30px var(--serif); color: #fff; margin-top: 6px; text-shadow: 0 2px 12px rgba(0, 0, 0, .8); }
#hud .d3 { font: 600 15px var(--sans); letter-spacing: .14em; color: #9fb3dc; text-transform: uppercase; margin-top: 6px; }
#hud.hidden { opacity: 0; }
#progress { position: fixed; left: 0; bottom: 0; height: 4px; width: 0; background: linear-gradient(90deg, var(--foot), var(--flight)); z-index: 10; transition: width .8s; }
</style>
</head>
<body class="impress-not-supported">
<div class="fallback-message"><p>This presentation needs a modern desktop browser (Chrome, Edge, Firefox or Safari).</p></div>
<div id="impress" data-width="1920" data-height="1080" data-max-scale="4" data-min-scale="0" data-perspective="1000" data-transition-duration="1700">
{{STEPS}}
</div>
<div id="hud" class="hidden"><div class="d1"></div><div class="d2"></div><div class="d3"></div></div>
<div id="progress"></div>
<script src="assets/impress.js"></script>
<script>
(function () {
  var CHAPTERS = {{CHAPTERS}};
  var api = impress();
  api.init();
  var root = document.getElementById('impress');
  var steps = Array.prototype.slice.call(root.querySelectorAll('.step:not(.skip)'));
  var hud = document.getElementById('hud');
  var prog = document.getElementById('progress');
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function swapImages(i) {
    steps.forEach(function (s, k) {
      var near = k >= i - 1 && k <= i + 2;
      s.querySelectorAll('img[data-full]').forEach(function (img) {
        var want = near ? img.dataset.full : img.dataset.thumb;
        if (img.getAttribute('src') === want || img.dataset.pending === want) return;
        if (!near) { delete img.dataset.pending; img.setAttribute('src', want); return; }
        img.dataset.pending = want;
        var pre = new Image();
        pre.src = want;
        (pre.decode ? pre.decode() : Promise.resolve()).then(function () {
          if (img.dataset.pending === want) { img.setAttribute('src', want); delete img.dataset.pending; }
        }, function () {});
      });
    });
  }
  // ---------------------------------------------------------------- map
  // The map is drawn by JS into a few <canvas> images that sit inside the impress scene, under the
  // slides. During a flight the GPU only scales those images: fixed memory, always in sync with the
  // camera. (It used to be one big SVG layer, which Chrome re-rasterises at the most zoomed-in scale
  // of the whole flight; on big zooms that blew the GPU tile budget and parts of the screen went blank.)
  // Before each flight we draw a sharp image of where we are, a sharp image of where we're going and
  // coarser in-between zoom levels covering what the camera passes on the way; on landing only the
  // destination image is kept.
  var MAP = {{MAPDATA}};
  var scene = root.firstElementChild;              // impress wraps all slides in this div
  var firstStep = scene.querySelector('.step');
  var SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  var SERIF = '"Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif';
  var COLOR = { train: '#5aa2ff', foot: '#ff5a36', bike: '#2fd3a0', flight: '#f4c44e' };
  var REST_PAD = 1.12;   // resting image covers the screen plus a margin
  var FLY_Q = 1.4;       // in-between levels: bitmap px per CSS px at their most zoomed-out moment
  var MAX_PX = 16e6, MAX_SIDE = 8192;
  function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }

  function bbox(a) {
    var b = [Infinity, Infinity, -Infinity, -Infinity];
    for (var i = 0; i < a.length; i += 2) { b[0] = Math.min(b[0], a[i]); b[1] = Math.min(b[1], a[i + 1]); b[2] = Math.max(b[2], a[i]); b[3] = Math.max(b[3], a[i + 1]); }
    return b;
  }
  function addLine(p, a) { p.moveTo(a[0], a[1]); for (var i = 2; i < a.length; i += 2) p.lineTo(a[i], a[i + 1]); }
  var LAND = new Path2D(), LAKES = new Path2D(), GRAT = new Path2D();
  MAP.land.forEach(function (r) { addLine(LAND, r); LAND.closePath(); });
  MAP.lakes.forEach(function (r) { addLine(LAKES, r); LAKES.closePath(); });
  MAP.grat.forEach(function (g) { GRAT.moveTo(g[0], g[1]); GRAT.lineTo(g[2], g[3]); });
  var LEGS = MAP.legs.map(function (l) {
    var p = new Path2D(); addLine(p, l.p);
    return { ch: l.ch, m: l.m, len: l.len, path: p, flight: false, box: bbox(l.p) };
  }).concat(MAP.flights.map(function (f) {
    var p = new Path2D(), q = f.q; p.moveTo(q[0], q[1]); p.quadraticCurveTo(q[2], q[3], q[4], q[5]);
    return { ch: f.ch, m: 'flight', len: f.len, path: p, flight: true, box: bbox(q) };
  }));

  // what's drawn: legs that are on, photo dots up to a day
  var mapOn = LEGS.map(function () { return false; }), mapDay = -1;
  function legOn(l, ch) { return l.flight ? ch === l.ch : ch >= 0 && l.ch <= ch; }
  function stateFor(st) {   // the map while flying to st: the chapter's own new legs wait for landing, to draw in
    var ch = +st.dataset.ch;
    LEGS.forEach(function (l, i) {
      var want = legOn(l, ch);
      if (want && !mapOn[i] && (l.ch === ch || ch >= 99)) return;
      mapOn[i] = want;
    });
    mapDay = +st.dataset.day;
  }
  function stateSig() { return mapDay + ':' + mapOn.map(Number).join(''); }

  // camera maths, mirroring impress.js: screen = centre + (windowScale / s) * rotate(-r) * (p - step)
  function winScale() { return Math.min(innerWidth / 1920, innerHeight / 1080); }
  function cam(st) { var d = st.dataset; return { x: +d.x || 0, y: +d.y || 0, s: +d.scale || 1, r: +(d.rotateZ || d.rotate || 0) }; }
  function view(x, y, s, r, pad) {   // bounding box (scene units) of what the screen shows
    var k = s / winScale() * pad, hw = innerWidth / 2 * k, hh = innerHeight / 2 * k;
    var a = r * Math.PI / 180, c = Math.abs(Math.cos(a)), n = Math.abs(Math.sin(a));
    var ex = hw * c + hh * n, ey = hw * n + hh * c;
    return [x - ex, y - ey, x + ex, y + ey];
  }
  function bezier(x1, y1, x2, y2) {
    return function (t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      var lo = 0, hi = 1, u = t;
      for (var i = 0; i < 24; i++) {
        u = (lo + hi) / 2;
        var x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
        if (x < t) lo = u; else hi = u;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    };
  }
  var easeInOut = bezier(.42, 0, .58, 1), easeDraw = bezier(.5, 0, .3, 1), easeOut = bezier(0, 0, .58, 1);
  function union(a, b) { return a ? [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])] : b.slice(); }
  function inside(o, i) { return i[0] >= o[0] && i[1] >= o[1] && i[2] <= o[2] && i[3] <= o[3]; }

  // map images. kind: 'map' (land, lines), 'anim' (legs drawing in), 'lab' (labels, place and photo dots)
  var ORD = 0;
  function makeLayer(rect, res, z, kind) {
    var w = rect[2] - rect[0], h = rect[3] - rect[1];
    res = Math.min(res, MAX_SIDE / w, MAX_SIDE / h, Math.sqrt(MAX_PX / (w * h)));
    var cv = document.createElement('canvas');
    cv.className = 'mapcv';
    cv.width = Math.max(1, Math.ceil(w * res)); cv.height = Math.max(1, Math.ceil(h * res));
    cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
    cv.style.transform = 'translate3d(' + rect[0] + 'px,' + rect[1] + 'px,0) scale(' + (1 / res) + ')';
    if (kind === 'lab') cv.style.transition = 'opacity .35s ease-out';
    return { cv: cv, rect: rect, res: res, z: z, kind: kind, ord: ORD++, holes: false };
  }
  function drop(L) { if (L && L.cv.parentNode) { L.cv.remove(); L.cv.width = L.cv.height = 0; } }
  var live = [], RANK = { map: 0, anim: 1, lab: 2 };
  function setLive(list) {   // map under drawing-in legs under labels; coarse under fine; all under the slides
    live.forEach(function (L) { if (list.indexOf(L) < 0) drop(L); });
    live = list.slice().sort(function (a, b) { return RANK[a.kind] - RANK[b.kind] || a.res - b.res || a.ord - b.ord; });
    live.forEach(function (L) { scene.insertBefore(L.cv, firstStep); });
  }
  // Where a finer image of the same kind lies on top, clear the coarser one: they're transparent over
  // the sea, so otherwise both would show (double labels, brighter dots, after-images).
  function punch(kind) {
    var ls = live.filter(function (L) { return L.kind === kind; });
    ls.forEach(function (L, i) {
      var ctx = L.cv.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ls.slice(i + 1).forEach(function (U) {
        var x0 = Math.max(L.rect[0], U.rect[0]), y0 = Math.max(L.rect[1], U.rect[1]), x1 = Math.min(L.rect[2], U.rect[2]), y1 = Math.min(L.rect[3], U.rect[3]);
        if (x0 >= x1 || y0 >= y1) return;
        // stay 1 px inside the finer image so no seam opens up
        ctx.clearRect(Math.ceil((x0 - L.rect[0]) * L.res) + 1, Math.ceil((y0 - L.rect[1]) * L.res) + 1,
          Math.floor((x1 - x0) * L.res) - 2, Math.floor((y1 - y0) * L.res) - 2);
        L.holes = true;
      });
    });
  }

  function strokeLeg(ctx, l, z, p) {
    ctx.strokeStyle = COLOR[l.m];
    ctx.lineWidth = (l.flight ? 5 : l.m === 'train' ? 3 : 4) * z;
    if (l.m === 'train') { ctx.setLineDash([9 * z, 7 * z]); ctx.globalAlpha = p; }
    else if (p < 1) { ctx.setLineDash([l.len, l.len]); ctx.lineDashOffset = l.len * (1 - p); }
    else ctx.setLineDash([]);
    ctx.stroke(l.path);
    ctx.globalAlpha = 1; ctx.lineDashOffset = 0; ctx.setLineDash([]);
  }
  // text runs left to right: [text, font, fill, alpha, gapBefore]; anchor 0 = start, .5 = middle, 1 = end
  function runs(ctx, X, Y, list, anchor, halo, haloW, spacing) {
    var w = 0, xs = [];
    ctx.letterSpacing = (spacing || 0) + 'px';
    list.forEach(function (r) { ctx.font = r[1]; w += r[4] || 0; xs.push(w); w += ctx.measureText(r[0]).width; });
    var x0 = X - w * anchor;
    if (halo) {   // SVG paint-order: stroke under fill
      ctx.strokeStyle = halo; ctx.lineWidth = haloW; ctx.lineJoin = 'round';
      list.forEach(function (r, i) { ctx.font = r[1]; ctx.strokeText(r[0], x0 + xs[i], Y); });
    }
    list.forEach(function (r, i) { ctx.font = r[1]; ctx.fillStyle = r[2]; ctx.globalAlpha = r[3]; ctx.fillText(r[0], x0 + xs[i], Y); });
    ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
    return x0 + w;
  }
  function font(style, weight, px, fam) { return style + ' ' + weight + ' ' + px.toFixed(2) + 'px ' + fam; }
  function polishFlag(ctx, x, y, u) {   // 🇵🇱 drawn, so it looks the same on every OS
    var w = 24 * u, h = 15 * u;
    ctx.fillStyle = '#0a1122'; ctx.fillRect(x - 2 * u, y - 2 * u, w + 4 * u, h + 4 * u);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h / 2);
    ctx.fillStyle = '#dc143c'; ctx.fillRect(x, y + h / 2, w, h / 2);
  }
  function labels(ctx, L) {
    var res = L.res, r = L.rect, u = L.z * res;   // u: bitmap px per label px
    if (u < .22) return;
    function X(x) { return (x - r[0]) * res; }
    function Y(y) { return (y - r[1]) * res; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.textBaseline = 'alphabetic';
    MAP.gratL.forEach(function (g) { runs(ctx, X(g[1]), Y(g[2]), [[g[0], font('normal', 400, 13 * u, SANS), '#34446b', 1]], 0); });
    MAP.water.forEach(function (w) {
      var f = font('italic', 400, 17 * u, SERIF);
      runs(ctx, X(w[2]), Y(w[3]), [[w[0], f, '#3f5283', 1], [w[1], f, '#3f5283', .75, 6.8 * u]], .5, null, 0, 4.25 * u);
    });
    MAP.places.forEach(function (p) {
      var k = p[4], city = /city/.test(k), dim = /dim/.test(k), left = /left/.test(k), x = X(p[2]), y = Y(p[3]);
      ctx.beginPath(); ctx.arc(x, y, (city ? 6 : dim ? 3 : 4.5) * u, 0, 2 * Math.PI);
      ctx.fillStyle = dim ? '#56648a' : '#ece5d3'; ctx.fill();
      var px = (city ? 22 : 16) * u, wt = city ? 700 : dim ? 400 : 600, fill = dim ? '#7584a8' : '#dfe5f1';
      runs(ctx, x + (left ? -10 : 10) * u, y + 6 * u, [[p[0], font('normal', wt, px, SANS), fill, 1], [' ' + p[1], font('normal', wt, px, SERIF), fill, .75]],
        left ? 1 : 0, '#0a1122', 4 * u);
    });
    MAP.peaks.forEach(function (p) {
      var x = X(p[3]), y = Y(p[4]), left = p[5];
      runs(ctx, x, y + 6.3 * u, [['▲', font('normal', 400, 18 * u, SANS), '#f3eee4', 1]], .5);
      runs(ctx, x + (left ? -14 : 14) * u, y + 5.25 * u, [[p[0] + ' ' + p[1], font('normal', 600, 15 * u, SANS), '#f3eee4', 1],
        [p[2] + ' m', font('normal', 400, 15 * u, SANS), '#f4c44e', 1, 6 * u]], left ? 1 : 0, '#0a1122', 4 * u);
    });
    MAP.cities.forEach(function (c) {
      var x = X(c[1]), y = Y(c[2]);
      ctx.beginPath(); ctx.arc(x, y, 6 * u, 0, 2 * Math.PI); ctx.fillStyle = '#ece5d3'; ctx.fill();
      var end = runs(ctx, x + 10 * u, y + 6 * u, [[c[0], font('normal', 700, 22 * u, SANS), '#dfe5f1', 1]], 0, '#0a1122', 4 * u);
      polishFlag(ctx, end + 9 * u, y - 10 * u, u);
    });
  }
  function scenePx(L, ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, L.cv.width, L.cv.height);
    ctx.setTransform(L.res, 0, 0, L.res, -L.rect[0] * L.res, -L.rect[1] * L.res);
  }
  function photoDots(ctx, z) {
    if (mapDay < 0) return;
    var d = MAP.dots, dp = new Path2D(), rr = 3.2 * z;
    for (var k = 0; k < d.length; k += 3) if (d[k + 2] <= mapDay) { dp.moveTo(d[k] + rr, d[k + 1]); dp.arc(d[k], d[k + 1], rr, 0, 2 * Math.PI); }
    ctx.globalAlpha = .9; ctx.fillStyle = '#fff4d8'; ctx.fill(dp); ctx.globalAlpha = 1;
  }
  function paint(L, skip) {   // skip: legs left out (they're being drawn in on top)
    var ctx = L.cv.getContext('2d'), z = L.z;
    scenePx(L, ctx);
    L.sig = stateSig(); L.holes = false;
    if (L.kind === 'lab') { photoDots(ctx, z); labels(ctx, L); return L; }
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = '#172340'; ctx.lineWidth = z; ctx.stroke(GRAT);
    ctx.fillStyle = '#16213a'; ctx.fill(LAND);
    ctx.strokeStyle = '#3a4c78'; ctx.lineWidth = 1.1 * z; ctx.stroke(LAND);
    ctx.fillStyle = '#0b1226'; ctx.fill(LAKES); ctx.lineWidth = .8 * z; ctx.stroke(LAKES);
    ctx.globalAlpha = .16;   // faint ghost of the whole route
    LEGS.forEach(function (l) {
      if (l.flight) return;
      ctx.strokeStyle = COLOR[l.m]; ctx.lineWidth = 2 * z;
      ctx.setLineDash(l.m === 'train' ? [8 * z, 8 * z] : []);
      ctx.stroke(l.path);
    });
    ctx.globalAlpha = 1; ctx.setLineDash([]);
    LEGS.forEach(function (l, i) { if (mapOn[i] && !(skip && skip[i])) strokeLeg(ctx, l, z, 1); });
    if (L.withLabels) { photoDots(ctx, z); labels(ctx, L); }
    return L;
  }

  // restMap / restLab: the images for the slide we're on (or flying to)
  var restMap = null, restLab = null, drawing = null, inFlight = false;
  function restKey(st) { return st.id + '|' + innerWidth + 'x' + innerHeight + '@' + dpr(); }
  function restLayer(st, kind) {
    var c = cam(st), L = makeLayer(view(c.x, c.y, c.s, c.r, REST_PAD), winScale() * dpr() / c.s, c.s, kind);
    L.key = restKey(st);
    return L;
  }
  function reuse(L, st) { return L && L.key === restKey(st) && L.sig === stateSig() && !L.holes ? L : null; }
  function stopDrawIn() {
    if (!drawing) return;
    cancelAnimationFrame(drawing.raf);
    drawing = null;
    if (restMap) restMap.sig = 'stale';
  }
  // called by impress right before the camera starts moving (also for a new target mid-flight)
  function planFlight(from, to, d) {
    stopDrawIn();
    var a = cam(from), b = cam(to), midFlight = inFlight, zoom = a.s !== b.s;
    stateFor(to);
    var A = reuse(restMap, from) || paint(restLayer(from, 'map'));
    var LA = reuse(restLab, from) || paint(restLayer(from, 'lab'));
    var B = paint(restLayer(to, 'map')), LB = restLayer(to, 'lab');
    LB.ord = LA.ord - 0.5;   // same zoom: destination labels sit under the origin ones until we land
    paint(LB);
    // sample the camera path exactly as impress animates it (zoom and pan staggered by half the duration)
    var zoomin = b.s <= a.s;
    var dR = !zoom || !zoomin ? 0 : d / 2, dC = !zoom || zoomin ? 0 : d / 2, total = zoom ? 1.5 * d : d;
    var wS = winScale(), sMin = Math.min(a.s, b.s), lv = {}, okA = a.s * FLY_Q / dpr(), okB = b.s * FLY_Q / dpr();
    for (var i = 0; i <= 64; i++) {
      var t = total * i / 64, pr = easeInOut((t - dR) / d), pc = easeInOut((t - dC) / d);
      var s = wS / (wS / a.s + (wS / b.s - wS / a.s) * pr);
      var v = view(a.x + (b.x - a.x) * pc, a.y + (b.y - a.y) * pc, s, a.r + (b.r - a.r) * pc, 1.06);
      if ((s >= okA && inside(A.rect, v)) || (s >= okB && inside(B.rect, v))) continue;
      var k = Math.max(0, Math.floor(Math.log2(s / sMin) + 1e-9)), o = lv[k] || (lv[k] = { rect: null, lo: Infinity, hi: 0 });
      o.rect = union(o.rect, v); o.lo = Math.min(o.lo, s); o.hi = Math.max(o.hi, s);
    }
    var list = [A, B, LA, LB];
    Object.keys(lv).forEach(function (k) {
      var o = lv[k], L = makeLayer(o.rect, wS * FLY_Q / o.hi, Math.sqrt(o.lo * o.hi), 'map');
      L.withLabels = !zoom;   // a pan at one zoom keeps its labels; zooms fade them out and back in
      list.push(paint(L));
    });
    // a new target mid-flight: the camera is somewhere in between, so keep the old images too
    if (midFlight) live.forEach(function (L) { if (list.indexOf(L) < 0 && L.kind !== 'anim') list.push(L); });
    setLive(list);
    if (!midFlight) { punch('map'); if (!zoom) punch('lab'); }
    if (zoom) { LA.cv.style.opacity = '0'; LB.cv.style.transition = 'none'; LB.cv.style.opacity = '0'; }
    restMap = B; restLab = LB;
    inFlight = true;
  }
  function land(st) {
    stopDrawIn();
    inFlight = false;
    if (!restMap || restMap.key !== restKey(st)) {
      stateFor(st);
      restMap = paint(restLayer(st, 'map')); restLab = paint(restLayer(st, 'lab'));
    } else {
      if (restMap.holes || restMap.sig !== stateSig()) paint(restMap);
      if (restLab.holes || restLab.sig !== stateSig()) paint(restLab);
    }
    setLive([restMap, restLab]);
    restLab.cv.style.transition = 'opacity .35s ease-out';
    restLab.cv.style.opacity = '1';
    // this chapter's legs that aren't on yet draw themselves in
    var ch = +st.dataset.ch, fresh = {}, box = null;
    LEGS.forEach(function (l, i) { if (legOn(l, ch) && !mapOn[i]) { fresh[i] = true; mapOn[i] = true; box = union(box, l.box); } });
    if (!box) return;
    var R = restMap, pad = 8 * R.z;
    var rect = [Math.max(R.rect[0], box[0] - pad), Math.max(R.rect[1], box[1] - pad), Math.min(R.rect[2], box[2] + pad), Math.min(R.rect[3], box[3] + pad)];
    if (rect[0] >= rect[2] || rect[1] >= rect[3]) { paint(R); return; }   // off screen: just show them
    var A = makeLayer(rect, R.res, R.z, 'anim'), ctx = A.cv.getContext('2d'), t0 = performance.now();
    setLive([R, A, restLab]);
    var job = drawing = { raf: 0 };
    (function frame(now) {
      if (drawing !== job) return;
      var t = (now || t0) - t0;
      scenePx(A, ctx);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      LEGS.forEach(function (l, i) { if (fresh[i]) strokeLeg(ctx, l, A.z, l.m === 'train' ? easeOut(t / 900) : easeDraw(t / 2400)); });
      if (t < 2400) { job.raf = requestAnimationFrame(frame); return; }
      drawing = null;
      paint(R);
      setLive([R, restLab]);
    })();
  }
  impress.addPreStepLeavePlugin(function (e) {
    if (e.target && e.detail && e.detail.next && e.detail.next !== e.target) planFlight(e.target, e.detail.next, +e.detail.transitionDuration || 0);
  }, 10);
  if (document.fonts) {
    document.fonts.load('400 20px "Shippori Mincho"', '東京海').then(function () { return document.fonts.load('700 20px "Shippori Mincho"', '東京'); })
      .then(function () { if (restLab && !inFlight) paint(restLab); }, function () {});
  }

  // Photo-card culling. During a camera flight Chrome rasterises every visible card at the most
  // zoomed-in scale of the whole flight (~20 MB per card on a retina screen) and the GPU tile
  // budget is ~900 MB, so a flight that starts or ends zoomed out with 100+ cards in view runs out
  // of memory and drops tiles (blank photos, white patches). So: in flight only the cards next to
  // either end exist; at rest a zoomed-out slide shows them all (rasterised tiny, so cheap).
  var REST = 8, FLY = 3;
  function isWide(s) { return s.classList.contains('title-step') || s.classList.contains('flight-step'); }
  function cull(i) {
    var all = isWide(steps[i]);
    steps.forEach(function (s, k) {
      if (s.classList.contains('card')) s.classList.toggle('culled', !all && Math.abs(k - i) > REST);
    });
  }
  function cullForFlight(ci, ni) {
    steps.forEach(function (s, k) {
      if (s.classList.contains('card')) s.classList.toggle('culled', Math.abs(k - ni) > FLY && Math.abs(k - ci) > FLY);
    });
  }

  document.addEventListener('impress:stepenter', function (e) {
    var st = e.target, i = steps.indexOf(st);
    cull(i);
    land(st);
    swapImages(i);
    var ch = +st.dataset.ch, day = +st.dataset.day;
    prog.style.width = (100 * i / (steps.length - 1)) + '%';
    if (st.dataset.date && day < 99) {
      var dt = new Date(st.dataset.date + 'T12:00:00Z');
      hud.querySelector('.d1').textContent = 'Day ' + (day + 1) + ' / 28';
      hud.querySelector('.d2').textContent = st.dataset.place || '';
      hud.querySelector('.d3').textContent = WD[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()] + (ch >= 0 ? ' · ' + CHAPTERS[ch] : '');
      hud.classList.toggle('hidden', st.classList.contains('chapter') || st.classList.contains('viz'));
    } else {
      hud.classList.add('hidden');
    }
    var v = st.querySelector('video');
    if (v) {
      if (!v.getAttribute('src')) v.setAttribute('src', v.dataset.src);
      try { v.currentTime = 0; } catch (err) {}
      v.muted = false;
      var p = v.play();
      if (p && p.catch) p.catch(function () { v.muted = true; v.play().catch(function () {}); });
    }
  });
  document.addEventListener('impress:stepleave', function (e) {
    var v = e.target.querySelector('video');
    if (v) v.pause();
    var next = e.detail && e.detail.next;
    if (next) {
      var ni = steps.indexOf(next), ci = steps.indexOf(e.target);
      cullForFlight(ci, ni);
      swapImages(ni);
    }
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'o' || e.key === 'O') api.goto('route');
    if (e.key === 'h' || e.key === 'H') hud.classList.toggle('hidden');
  });

  // full-screen button on the title slide (hidden where the browser can't do it, e.g. iPhone Safari)
  var fsBtn = document.querySelector('.fs-btn');
  if (fsBtn) {
    var de = document.documentElement;
    var fsOn = function () { return document.fullscreenElement || document.webkitFullscreenElement; };
    if (!(de.requestFullscreen || de.webkitRequestFullscreen)) fsBtn.style.display = 'none';
    fsBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
      fsBtn.blur();   // so space/enter move the slides instead of pressing the button again
    });
    var fsLabel = function () { fsBtn.querySelector('span').textContent = fsOn() ? 'Exit full screen' : 'Full screen'; };
    document.addEventListener('fullscreenchange', fsLabel);
    document.addEventListener('webkitfullscreenchange', fsLabel);
  }
})();
</script>
</body>
</html>
